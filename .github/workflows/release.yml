name: Release Standalone Binaries

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            asset_name: secapi-linux
          - os: macos-latest
            asset_name: secapi-macos
          - os: windows-latest
            asset_name: secapi-windows.exe

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        shell: bash
        run: |
          pip install --upgrade pip
          pip install -e .
          pip install pyinstaller

      - name: Build Executable
        shell: bash
        run: |
          pyinstaller --onefile --name secapi secapi/cli.py

      - name: Rename executable
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            mv dist/secapi.exe dist/${{ matrix.asset_name }}
          else
            mv dist/secapi dist/${{ matrix.asset_name }}
          fi

      - name: Upload binaries to Release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/${{ matrix.asset_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
